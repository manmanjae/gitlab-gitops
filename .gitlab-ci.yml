# Public portfolio copy: example.test and 192.0.2.0/24 are placeholders. See docs/setup.md.
# ============================================================
# GitLab CI/CD 파이프라인 설정 파일
# ============================================================
# 목적:
# 1. GitOps 매니페스트와 CI 설정 파일의 기본 문법을 검증합니다.
# 2. api-tester 소스가 변경된 경우에만 Docker 이미지를 빌드하고 Harbor에 push합니다.
# 3. 이미지 빌드가 성공하면 GitOps dev overlay의 image tag(newTag)만 자동으로 수정합니다.
# 4. GitLab Runner가 자동으로 만든 deploy commit은 다시 Pipeline을 만들지 않도록 차단합니다.
#
# 전체 흐름:
# 개발자 api-tester 수정
# -> GitLab Pipeline 실행
# -> Docker image build
# -> Harbor push
# -> k8s-gitops/apps/api-tester/overlays/dev/kustomization.yaml newTag 수정
# -> GitLab에 deploy commit push
# -> Argo CD가 Git 변경 감지
# -> Kubernetes app-dev namespace에 자동 배포
# ============================================================

workflow:
  rules:
    # update-gitops Job이 자동으로 만드는 commit 메시지는 아래 형식입니다.
    #
    # 예:
    # deploy api-tester image29
    #
    # 이 commit까지 다시 Pipeline을 만들면 이미지 번호가 건너뛰거나,
    # 경우에 따라 Pipeline이 반복 실행될 수 있습니다.
    # 그래서 [skip ci] 대신 workflow 단계에서 Pipeline 생성을 차단합니다.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TITLE =~ /^deploy api-tester image[0-9]+$/'
      when: never

    # 일반 push 이벤트에서 아래 경로 중 하나가 변경되면 Pipeline을 생성합니다.
    # api-tester 변경은 이미지 빌드/푸시까지 이어지고,
    # k8s-gitops 또는 CI 설정 변경은 GitOps 검증만 수행합니다.
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - api-tester/**/*
        - k8s-gitops/**/*
        - sonar-project.properties
        - .gitlab-ci.yml
      when: always

    # GitLab UI의 New pipeline 버튼으로 수동 실행하는 경우를 허용합니다.
    # 현재 Job-level rules 기준으로는 수동 실행 시 validate-gitops만 실행됩니다.
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always

    # 위 조건에 해당하지 않는 경우 Pipeline을 생성하지 않습니다.
    - when: never

stages:
  - validate
  - sonar
  - build
  - update-gitops

default:
  tags:
    - onprem

variables:
  # Harbor에 저장될 이미지 이름입니다.
  IMAGE_NAME: "api-tester"

  # 이미지 태그입니다. 예: Pipeline IID가 29이면 image29
  IMAGE_TAG: "image${CI_PIPELINE_IID}"

  # Harbor에 push할 최종 이미지 전체 경로입니다.
  # HARBOR_REGISTRY, HARBOR_PROJECT는 GitLab CI/CD Variables에 등록되어 있어야 합니다.
  FULL_IMAGE: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}:${IMAGE_TAG}"

  # GitLab Runner가 자동으로 수정할 GitOps overlay 파일 경로입니다.
  # 이 파일 안의 images.newTag 값이 image29 같은 값으로 바뀝니다.
  GITOPS_OVERLAY: "k8s-gitops/apps/api-tester/overlays/dev/kustomization.yaml"

.rules_validate_gitops: &rules_validate_gitops
  rules:
    # push 이벤트에서 아래 경로들이 변경되면 검증 Job을 실행합니다.
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - api-tester/**/*
        - k8s-gitops/**/*
        - .gitlab-ci.yml
      when: on_success

    # GitLab UI에서 수동 Pipeline 실행 시에도 검증 Job을 실행합니다.
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success

    - when: never

.rules_sonar_analysis: &rules_sonar_analysis
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - api-tester/**/*
        - sonar-project.properties
        - .gitlab-ci.yml
      when: on_success

    - when: never

.rules_api_source_changed: &rules_api_source_changed
  rules:
    # api-tester 애플리케이션 소스 또는 Dockerfile 등이 변경된 경우에만 실행합니다.
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - api-tester/**/*
      when: on_success

    - when: never

validate-gitops:
  stage: validate
  <<: *rules_validate_gitops
  script:
    # GitLab은 Pipeline 생성 전에 .gitlab-ci.yml을 먼저 파싱합니다.
    # 아래 Ruby 검사는 Runner 서버에 ruby가 있을 때 한 번 더 YAML 파싱을 해보는 보조 검증입니다.
    - |
      if command -v ruby >/dev/null 2>&1; then
        ruby -e 'require "yaml"; YAML.load_file(".gitlab-ci.yml"); puts ".gitlab-ci.yml YAML parse OK"'
      else
        echo "ruby not found; relying on GitLab CI config parser"
      fi

    # App of Apps 구조 검증입니다.
    - kubectl kustomize k8s-gitops/applications

    # api-tester dev 환경 배포 매니페스트 검증입니다.
    - kubectl kustomize k8s-gitops/apps/api-tester/overlays/dev

sonarqube-check:
  stage: sonar
  <<: *rules_sonar_analysis
  variables:
    # 소스 이력을 모두 받아서 변경 코드와 작성자 정보를 정확하게 분석합니다.
    GIT_DEPTH: "0"

  script:
    # 현재 Runner는 Shell Executor이므로 Scanner 컨테이너를 Docker로 실행합니다.
    - >
      docker run --rm
      --add-host sonarqube.example.test:192.0.2.11
      -e SONAR_HOST_URL="$SONAR_HOST_URL"
      -e SONAR_TOKEN="$SONAR_TOKEN"
      -e SONAR_USER_HOME="/tmp/.sonar"
      -v "$CI_PROJECT_DIR:/usr/src"
      -w /usr/src
      sonarsource/sonar-scanner-cli:latest
      -Dsonar.qualitygate.wait=true

  # 최초 분석 단계에서는 Sonar 실패가 이미지 빌드를 막지 않게 합니다.
  # 배포 후 분석 결과 관찰을 위한 개인 실험입니다. 강제 품질 차단은 후속 과제입니다.
  allow_failure: true


build-image:
  stage: build
  <<: *rules_api_source_changed
  script:
    # Harbor 로그인입니다. 계정/비밀번호는 GitLab CI/CD Variables로 관리합니다.
    - echo "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" -u "$HARBOR_USERNAME" --password-stdin

    # api-tester Docker image build 후 Harbor에 push합니다.
    - docker build -t "$FULL_IMAGE" ./api-tester
    - docker push "$FULL_IMAGE"

update-gitops:
  stage: update-gitops
  needs:
    - job: build-image
  <<: *rules_api_source_changed
  script:
    # GitOps 자동 commit 작성자 정보입니다. 현재 repo에만 적용합니다.
    - git config user.email "ci-bot@example.test"
    - git config user.name "gitlab-ci"

    # GitOps overlay 파일과 newTag 필드가 없으면 즉시 실패시켜 잘못된 commit을 막습니다.
    - test -f "$GITOPS_OVERLAY"
    - grep -q "newTag:" "$GITOPS_OVERLAY"

    # Kustomize images.newTag 값을 새 Harbor image tag로 갱신합니다.
    # GitLab CI는 script 항목 안의 ": "를 YAML map처럼 해석할 수 있으므로 block string으로 감쌉니다.
    - |
      sed -i "s|newTag:.*|newTag: ${IMAGE_TAG}|" "$GITOPS_OVERLAY"
    - git diff -- "$GITOPS_OVERLAY"

    # 변경이 없으면 commit/push 없이 정상 종료합니다.
    - |
      if git diff --quiet -- "$GITOPS_OVERLAY"; then
        echo "No GitOps image tag change to commit"
        exit 0
      fi

    # GitOps 변경을 main branch에 push하면 Argo CD가 변경을 감지해서 배포합니다.
    - git add "$GITOPS_OVERLAY"
    - git commit -m "deploy api-tester ${IMAGE_TAG}"
    - git push "http://oauth2:${GITOPS_TOKEN}@gitlab.example.test/portfolio/gitlab-gitops.git" HEAD:main
