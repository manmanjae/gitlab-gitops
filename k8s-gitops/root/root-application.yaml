# Argo CD App of Apps의 시작점입니다.
# 이 root Application 하나를 클러스터에 apply하면, 아래 source.path의 applications/ 폴더를 읽어서
# api-tester, monitoring, logging child Application들을 Argo CD가 자동으로 생성/관리합니다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Argo CD UI에서 보이는 최상위 root app 이름입니다.
  name: cicd-root
  # Application CR은 Argo CD가 설치된 namespace에 둡니다.
  namespace: argocd
spec:
  project: default

  source:
    # root app도 GitLab repo를 바라봅니다.
    repoURL: http://gitlab.example.test/portfolio/gitlab-gitops.git
    # 운영 기준 branch입니다.
    targetRevision: main
    # 이 폴더의 kustomization.yaml이 child Application YAML들을 묶어줍니다.
    path: k8s-gitops/applications

  destination:
    server: https://kubernetes.default.svc
    # child Application 리소스가 생성될 namespace입니다.
    namespace: argocd

  syncPolicy:
    automated:
      # Git에서 제거된 child Application은 클러스터에서도 제거합니다.
      prune: true
      # 클러스터에서 수동으로 바뀐 값은 Git 기준으로 되돌립니다.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
