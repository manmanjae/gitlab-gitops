apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-httproute
  namespace: monitoring
  annotations:
    link.argocd.argoproj.io/api-tester: "http://grafana.example.test/"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cicd-gateway
      namespace: nginx-gateway
      sectionName: http

  hostnames:
    - "grafana.example.test"

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kube-prometheus-stack-grafana
          port: 80
          weight: 1
