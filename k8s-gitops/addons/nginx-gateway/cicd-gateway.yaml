apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cicd-gateway
  namespace: nginx-gateway
spec:
  gatewayClassName: nginx

  infrastructure:
    annotations:
      metallb.io/address-pool: default-pool
      metallb.io/loadBalancerIPs: "192.0.2.10"

  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.example.test"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - app-dev
                  - monitoring
                  - harbor

    - name: https
      protocol: HTTPS
      port: 443
      hostname: "harbor.example.test"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: harbor-tls
            namespace: harbor
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: harbor
