apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sonarqube
  namespace: nginx-gateway
spec:
  gatewayClassName: nginx

  infrastructure:
    annotations:
      metallb.io/address-pool: default-pool
      metallb.io/loadBalancerIPs: "192.0.2.11"

  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "sonarqube.example.test"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: sonarqube
