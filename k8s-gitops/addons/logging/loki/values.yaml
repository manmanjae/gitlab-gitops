# Loki dependency chart에 전달되는 values입니다.
# wrapper chart 구조라서 실제 Loki 설정은 loki: 아래에 한 번 더 중첩됩니다.
loki:
  # 단일 노드 테스트/학습 환경에 맞춰 Loki를 singleBinary 방식으로 실행합니다.
  deploymentMode: Monolithic

  loki:
    auth_enabled: false

    commonConfig:
      replication_factor: 1

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    storage:
      type: filesystem

    limits_config:
      # 로그 보관 기간입니다. 168h는 7일입니다.
      retention_period: 168h
      allow_structured_metadata: true
      volume_enabled: true

    compactor:
      retention_enabled: true
      delete_request_store: filesystem

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: openebs-hostpath
      size: 20Gi

  gateway:
    enabled: true

  lokiCanary:
    enabled: false

  test:
    enabled: false

  chunksCache:
    enabled: false

  resultsCache:
    enabled: false

  # Monolithic 모드에서는 분산 모드 컴포넌트 replica를 0으로 둡니다.
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomPlanner:
    replicas: 0
  bloomBuilder:
    replicas: 0
  bloomGateway:
    replicas: 0
