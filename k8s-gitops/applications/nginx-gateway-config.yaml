apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gateway-config
  namespace: argocd
spec:
  project: default

  source:
    repoURL: http://gitlab.example.test/portfolio/gitlab-gitops.git
    targetRevision: main
    path: k8s-gitops/addons/nginx-gateway

  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-gateway

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
