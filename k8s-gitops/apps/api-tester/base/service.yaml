# Internal ClusterIP Service for api-tester.
# Flow: Ingress -> Service port 80 -> targetPort http -> containerPort 8080.
apiVersion: v1
kind: Service
metadata:
  name: api-tester
spec:
  type: ClusterIP
  selector:
    app: api-tester
  ports:
    - name: http
      port: 80
      targetPort: http
